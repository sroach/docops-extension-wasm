[package]
name = "docops_extension"
version = "0.1.0"
edition = "2021"
description = "Rust based wasm solution to generate svg visuals from custom dsl"
repository = "https://github.com/sroach/docops-extension-wasm"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
regex = "1"
console_error_panic_hook = "0.1"
uuid = { version = "1.7", features = ["v4", "js"] }

[profile.release]
opt-level = "z"
lto = true


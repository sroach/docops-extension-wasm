<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>DocOps WASM SVG Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --card-border: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #e2e8f0;
                --card-border: #334155;
            }
            textarea {
                background: #1e293b;
                color: #e2e8f0;
                border-color: #334155;
            }
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            background: var(--bg);
            color: var(--text);
        }

        textarea {
            width: 100%;
            min-height: 260px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            margin: 16px 0;
            padding: 10px 16px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .output {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg);
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow-x: auto;
        }

        .output svg {
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
<h1>DocOps WASM SVG Demo</h1>
<p>Edit the chart DSL and render it in the browser using the generated WASM module.</p>

<textarea id="source">[docops,adr]
    ----
    visualVersion=2
    title= Adopt GraphQL for API Layer
    status= Accepted
    date= 2024-07-15
    context=
    - Our REST APIs have become complex with many endpoints
    - Mobile clients need to fetch data from multiple endpoints
    - Different clients need different data shapes
    - We need to reduce over-fetching and under-fetching of data
    decision=
    - We will adopt GraphQL for our API layer
    - We will maintain existing REST endpoints for backward compatibility
    - We will implement a gradual migration strategy
    - We will use Apollo Server for the GraphQL implementation
    consequences=
    - More efficient data fetching for clients
    - Improved developer experience with self-documenting API
    - Potential learning curve for the team
    - Need for new tooling and monitoring
    participants=
    Alex Rivera | API Architect | alex.rivera@example.com | #4F46E5
    Jasmine Wong | Frontend Lead | jasmine.wong@example.com | #059669
    David Kim | Backend Developer | david.kim@example.com | #D97706
    references=
    [[https://graphql.org/ GraphQL Official Documentation]]
    [[https://www.apollographql.com/docs/ Apollo GraphQL Documentation]]
    [[https://engineering.example.com/graphql-best-practices GraphQL Best Practices]]
    ----</textarea>

<br />
<button id="render">Render chart</button>

<div id="output" class="output"></div>

<script type="module">
    import init, { generate_svg } from './pkg/docops_extension.js';

    async function main() {
        await init();

        const source = document.getElementById('source');
        const output = document.getElementById('output');
        const button = document.getElementById('render');

        function render() {
            output.innerHTML = generate_svg(source.value);
        }

        button.addEventListener('click', render);
        render();
    }

    main().catch((error) => {
        console.error(error);
        document.getElementById('output').textContent = String(error);
    });
</script>
</body>
</html>

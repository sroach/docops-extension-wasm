<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WASM SVG Chart Demo</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --card-border: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #e2e8f0;
                --card-border: #334155;
            }
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 40px auto;
            background: var(--bg);
            color: var(--text);
        }
        .chart svg { max-width: 100%; height: auto; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 24px; }
    </style>
</head>
<body>


<!-- Chart 3 -->
<div class="chart" id="chart-3"></div>
<script type="text/plain" class="chart-source" data-target="chart-3">
    [docops,pie]
    ----
    theme=premium
    visualVersion=1
    title=Website Traffic
    ---
    Product A | 30
    Product B | 25
    Product C | 20
    Product D | 15
    Product E | 10
    ----
</script>


<!-- Chart 4 -->
<div class="chart" id="chart-4"></div>
<script type="text/plain" class="chart-source" data-target="chart-4">
    [docops,pie]
    ----
    shape=donut
    theme=premium
    title=Market Share by Region
    percentages=true
    ---
    North America | 1905
    Europe | 1302
    Asia Pacific | 1440
    Latin America | 890
    Middle East & Africa | 1279
    ----
</script>

<!-- Chart 5 -->
<div class="chart" id="chart-5"></div>
<script type="text/plain" class="chart-source" data-target="chart-5">
    [docops,pie]
    ----
    title=Budget Allocation
    legend=true
    shape=donut
    percentages=true
    visualVersion=1
    ---
    Engineering | 40
    Marketing | 25
    Sales | 20
    Operations | 10
    Admin | 5
    ----
</script>

<script type="module">
    // "docops_extension.js" and the accompanying .wasm file are produced by
    // `wasm-pack build --target web` (see README in this project).
    import init, { generate_svg } from '../pkg/docops_extension.js';

    async function main() {
        await init(); // loads and instantiates the .wasm binary

        // Find every embedded chart source and render it into its target div.
        document.querySelectorAll('script.chart-source').forEach((sourceEl) => {
            const dsl = sourceEl.textContent.trim();
            const targetId = sourceEl.dataset.target;
            const target = document.getElementById(targetId);

            if (!target) {
                console.error(`No target element #${targetId} for chart source`);
                return;
            }

            const svgString = generate_svg(dsl); // wasm returns raw SVG markup as a string
            target.innerHTML = svgString;
        });
    }

    main();
</script>
</body>
</html>

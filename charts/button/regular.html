<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>DocOps Regular Button Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 40px auto; background: #f8fafc; }
        .chart svg { max-width: 100%; height: auto; border: 1px solid #e2e8f0; border-radius: 12px; background: white; }
    </style>
</head>
<body>
    <h1>Regular Rounded Buttons</h1>
    <div class="chart" id="chart"></div>
    <script type="text/plain" id="source">
[docops,button]
----
shape=regular
columns=2
---
Standard Link | https://example.com
Active Component | # | | | #f59e0b | true
Disabled Action | # | | | | false | false
Custom Color | # | | | #ec4899
----
    </script>
    <script type="module">
        import init, { generate_svg } from '../../pkg/docops_extension.js';
        async function main() {
            await init();
            const dsl = document.getElementById('source').textContent.trim();
            document.getElementById('chart').innerHTML = generate_svg(dsl);
        }
        main();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>WASM SVG Quadrant Chart Demo</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #111827;
            --card-border: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #e2e8f0;
                --card-border: #334155;
            }
        }

        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            background: var(--bg);
            color: var(--text);
            padding: 0 20px;
        }
        .chart svg { max-width: 100%; height: auto; border: 1px solid var(--card-border); border-radius: 8px; margin-bottom: 32px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        p { color: #64748b; margin-bottom: 32px; }
    </style>
</head>
<body>

<h1>Quadrant Charts</h1>
<p>2D priority mapping and strategic decision-making matrixes generated via WebAssembly.</p>

<!-- Chart 1: Default Product Prioritization -->
<div class="chart" id="chart-1"></div>
<script type="text/plain" class="chart-source" data-target="chart-1">
    [docops,quadrant]
    ----
    title=Product Feature Prioritization
    xAxis=EFFORT REQUIRED
    yAxis=BUSINESS VALUE
    leaders=BIG BETS
    challengers=QUICK WINS
    visionaries=FILL-INS
    niche=THANKLESS
    ---
    Mobile App | 30 | 90 | Phase 1
    Social Integration | 20 | 45 | Phase 2
    Legacy Migration | 90 | 80 | Ops
    Custom Avatars | 10 | 15 | UI/UX
    AI Engine | 85 | 30 | Research
    Global Search | 40 | 70 | Core
    ----
</script>

<!-- Chart 2: Risk Assessment (Dark Mode) -->
<div class="chart" id="chart-2"></div>
<script type="text/plain" class="chart-source" data-target="chart-2">
    [docops,quadrant]
    ----
    title=Project Risk Assessment
    xAxis=PROBABILITY
    yAxis=IMPACT
    leaders=CRITICAL
    challengers=MAJOR
    visionaries=MINOR
    niche=MODERATE
    ---
    Server Failure | 15 | 95 | Infra
    Team Attrition | 40 | 60 | People
    Budget Cut | 20 | 85 | Finance
    API Downtime | 70 | 50 | Tech
    UI Glitch | 80 | 10 | UI
    ----
</script>


<div class="chart" id="chart-3"></div>
<script type="text/plain" class="chart-source" data-target="chart-3">
    [docops,quadrant]
    ----
    title= Security Risk Assessment
    xAxis= PROBABILITY
    yAxis= SEVERITY
    leaders= CRITICAL
    challengers= MAJOR
    visionaries= MINOR
    niche= MODERATE
    ---
    SQL Injection | 20 | 95 | Web
    Phishing | 80 | 60 | Human
    DDoS Attack | 40 | 70 | Network
    Stolen Laptop | 10 | 50 | Physical
    Expired Cert | 60 | 30 | Ops
    ----
</script>
<script type="module">
    import init, { generate_svg } from '../pkg/docops_extension.js';

    async function main() {
        await init();
        document.querySelectorAll('script.chart-source').forEach((sourceEl) => {
            const dsl = sourceEl.textContent.trim();
            const targetId = sourceEl.dataset.target;
            const target = document.getElementById(targetId);
            if (target) {
                target.innerHTML = generate_svg(dsl);
            }
        });
    }

    main();
</script>
</body>
</html>
